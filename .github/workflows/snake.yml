# ============================================================
# IMPORTANT: This file MUST be placed at this EXACT path in
# your dineshDevAI/dineshDevAI repo:
#
#     .github/workflows/snake.yml
#
# Not at the repo root as "snake.yml" — GitHub only detects
# and runs workflows inside the .github/workflows/ folder.
#
# Steps in the GitHub web UI:
#   1. Open your dineshDevAI/dineshDevAI repo
#   2. Click "Add file" -> "Create new file"
#   3. In the filename box type exactly: .github/workflows/snake.yml
#      (typing the slashes creates the folders automatically)
#   4. Paste this entire file's contents below the line
#   5. Commit directly to "main"
#   6. Go to the "Actions" tab -> you should see "Generate Snake
#      Animation" running (or run it manually via "Run workflow")
#   7. Wait ~1 minute, then refresh your profile page
#
# If you already committed "snake.yml" at the repo root, delete
# that file first (it does nothing sitting there).
# ============================================================

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"  # runs every 6 hours
  workflow_dispatch:        # lets you trigger it manually
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: dineshDevAI
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#E100FF&color_dots=#161B22,#3d1a5c,#6a24a6,#a233d6,#E100FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00D4FF

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
